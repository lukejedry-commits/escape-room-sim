<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Oathbound Keep</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud">
        <div id="chapter-cue">Chapter 1 · Hall</div>
        <div id="timer">01:00:00</div>
        <div id="build-id" aria-hidden="true"></div>
        <div id="overtime-penalty" class="hidden">Overtime penalty: 0</div>
        <div id="crosshair">+</div>
        <div id="inspect-hint" class="hidden"></div>
        <div id="pause-overlay" class="hidden">
          <div class="pause-panel">
            <h1>Paused</h1>
            <div class="pause-actions">
              <button type="button" id="btn-resume" class="pause-btn primary">Resume</button>
              <button type="button" id="btn-settings" class="pause-btn">Settings</button>
              <button type="button" id="btn-quit-title" class="pause-btn">Quit to Title</button>
            </div>
            <p id="settings-stub" class="settings-stub hidden">Settings coming soon</p>
            <p class="pause-hint">P or Esc to resume</p>
          </div>
        </div>
        <div id="title-overlay">
          <div class="title-panel">
            <h1>The Oathbound Keep</h1>
            <p class="title-sub">Escape Room · Gothic graybox</p>
            <button type="button" id="btn-enter" class="pause-btn primary">Enter the Keep</button>
          </div>
        </div>
        <div id="hotbar" aria-label="Inventory hotbar">
          <div class="slot empty" data-slot="0"></div>
          <div class="slot empty" data-slot="1"></div>
          <div class="slot empty" data-slot="2"></div>
          <div class="slot empty" data-slot="3"></div>
          <div class="slot empty" data-slot="4"></div>
          <div class="slot empty" data-slot="5"></div>
          <div class="slot empty" data-slot="6"></div>
          <div class="slot empty" data-slot="7"></div>
        </div>
        <div id="click-prompt" class="hidden">Click to look · WASD move · P pause</div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
